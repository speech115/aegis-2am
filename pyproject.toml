[project]
name = "aegis-2am"
version = "0.1.0"
description = "Aegis 2AM — Autonomous Banking Immune System (Client Shield + Self-Healing Bank with Graphify & Daytona Dual-Sandbox)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
sponsors = [
    "daytona<1",
    "graphifyy",
]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
